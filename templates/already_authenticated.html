{% extends "layout.html" %}

{% block title %}Already Authenticated - GraphManager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-lg text-center p-5 mt-5">
            <div class="bg-accent-soft d-inline-flex align-items-center justify-content-center rounded-circle mb-4 mx-auto" style="width: 80px; height: 80px;">
                <i class="fas fa-user-check text-primary fa-2x"></i>
            </div>
            <h1 class="h3 mb-3">You are already authenticated!</h1>
            <p class="text-muted mb-4">Welcome back, <strong>{{ session.username }}</strong>! You're already signed in and ready to go.</p>
            
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn btn-primary px-4">
                    <i class="fas fa-home me-2"></i>Go to Dashboard
                </a>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger px-4">
                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
