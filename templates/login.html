{% extends "layout.html" %}

{% block title %}Login - GraphManager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 mt-5">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-accent-soft d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px;">
                        <i class="fas fa-lock text-primary fa-lg"></i>
                    </div>
                    <h2 class="h4">Welcome Back</h2>
                    <p class="text-muted">Enter your credentials to access your account</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 bg-transparent">
                                <i class="fas fa-user text-muted small"></i>
                            </span>
                            <input type="text" name="username" id="username" class="form-control border-start-0" placeholder="Your username" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0 bg-transparent">
                                <i class="fas fa-key text-muted small"></i>
                            </span>
                            <input type="password" name="password" id="password" class="form-control border-start-0" placeholder="Your password" required>
                        </div>
                    </div>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary py-2">
                            <span>Sign In</span>
                            <i class="fas fa-arrow-right ms-2 small"></i>
                        </button>
                    </div>
                    
                    <div class="text-center">
                        <p class="text-muted small mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary text-decoration-none fw-semibold">Register here</a></p>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a href="/" class="text-muted text-decoration-none small">
                <i class="fas fa-chevron-left me-1"></i> Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
