{% extends "layout.html" %}

{% block title %}Create Node - GraphManager{% endblock %}

{% block head %}
<!-- Prism -->
<link id="import-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" />

<!-- code-input -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/WebCoder49/code-input@2.1/code-input.css">
<script src="https://cdn.jsdelivr.net/gh/WebCoder49/code-input@2.1/code-input.js"></script>
<script src="https://cdn.jsdelivr.net/gh/WebCoder49/code-input@2.1/plugins/indent.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/WebCoder49/code-input@2.1/plugins/prism-line-numbers.min.css">
<script>
    codeInput.registerTemplate("code-input", codeInput.templates.prism(Prism, [new codeInput.plugins.Indent()]));
    codeInput.registerTemplate("demo", codeInput.templates.prism(Prism, [new codeInput.plugins.Indent()]));
</script>
<style>
    code-input {
        width: 100%;
        height: 500px;
        border-radius: 0.5rem;
        border: 1px solid var(--border-color);
        overflow: hidden;
    }
    .code-input-wrapper {
        position: relative;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('blog.get_templates') }}">Templates</a></li>
                <li class="breadcrumb-item active" aria-current="page">Create Node</li>
            </ol>
        </nav>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <div class="d-flex align-items-center">
                    <div class="bg-primary text-white p-2 rounded me-3">
                        <i class="fas fa-plus"></i>
                    </div>
                    <h1 class="h5 mb-0">Create New Node</h1>
                </div>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Node Name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="e.g. My Awesome Template" required>
                            <div class="form-text">Unique identifier for this node.</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="content" class="form-label">Content (HTML/Template)</label>
                        <div class="code-input-wrapper">
                            <code-input required id="content" name="content" class="line-numbers" lang="html" placeholder="Write your template here..." template="demo"></code-input>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="base_url" class="form-label">Base URL</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-link small"></i></span>
                                <input type="text" id="base_url" name="base_url" class="form-control" placeholder="https://example.com" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="url" class="form-label">Slug / Path</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-hashtag small"></i></span>
                                <input type="text" id="url" name="url" class="form-control" placeholder="my-page" required>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4 opacity-25">

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('blog.get_templates') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-save me-2"></i>Create Node
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
