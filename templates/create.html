<!DOCTYPE html>
<html>
<head>
    <title>Create Node</title>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Prism -->
    <link id="import-theme" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" />

    <!-- code-input -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/WebCoder49/code-input@2.1/code-input.css">
    <script src="https://cdn.jsdelivr.net/gh/WebCoder49/code-input@2.1/code-input.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/WebCoder49/code-input@2.1/plugins/indent.min.js"></script>
    <link rel="stylesheet" x
        href="https://cdn.jsdelivr.net/gh/WebCoder49/code-input@2.1/plugins/prism-line-numbers.min.css">
    <script>
        codeInput.registerTemplate("code-input", codeInput.templates.prism(Prism, [new codeInput.plugins.Indent()]));
        codeInput.registerTemplate("demo", codeInput.templates.prism(Prism, [new codeInput.plugins.Indent()]));
    </script>
    <style>
        code-input {
            width: 90%;
            height: 70vh; /* 70% of the viewport height */
            display: flex; /* Ensures the width and height properties are applied properly */
        }
    </style>
</head>
<body>
    <h1>Create Node</h1>
    <form method="post">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" value=""><br>
        <label for="content">Content:</label><br>
        <code-input required id="content" name="content" class="line-numbers" lang="html" placeholder="" template="demo"></code-input><br>
        <label for="base_url">Base URL:</label>
        <input type="text" id="base_url" name="base_url" required><br>
        <label for="url">URL:</label>
        <input type="text" id="url" name="url" required><br>
        <br>
        <input type="submit" value="Create">
    </form>
</body>
</html>
